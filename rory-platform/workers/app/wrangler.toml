name = "rory-platform-app"
main = "src/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

[vars]
ROOT_DOMAIN = "rorygpk.online"
COOKIE_DOMAIN = ".rorygpk.online"
TURNSTILE_SITE_KEY = ""
MAX_UPLOAD_BYTES = "10485760"
USER_STORAGE_LIMIT_BYTES = "104857600"
GLOBAL_STORAGE_LIMIT_BYTES = "1073741824"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rory-platform-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "rory-platform-files"
