name: Rory Platform Phase 1

on:
  workflow_dispatch:
    inputs:
      replace_existing:
        description: "Replace an existing rory-platform directory"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate real project foundation
        shell: bash
        env:
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import textwrap

          root = Path("rory-platform")
          replace = os.environ.get("REPLACE_EXISTING", "false").lower() == "true"

          if root.exists():
              if not replace:
                  raise SystemExit(
                      "rory-platform already exists. Run again with replace_existing=true only if you intend to replace it."
                  )
              shutil.rmtree(root)

          def put(relative_path, content):
              target = root / relative_path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")

          put(".gitignore", """
              node_modules
              .wrangler
              .dev.vars
              .env
              .env.*
              !.env.example
          """)

          put("package.json", """
              {
                "name": "rory-platform",
                "private": true,
                "version": "0.1.0",
                "type": "module",
                "scripts": {
                  "check": "node --check workers/app/src/index.js && node --check workers/app/public/site.js",
                  "deploy:app": "wrangler deploy --config workers/app/wrangler.toml",
                  "deploy:mail": "wrangler deploy --config workers/mail-router/wrangler.toml"
                },
                "devDependencies": {
                  "wrangler": "^4.10.0"
                }
              }
          """)

          put("README.md", """
              # Rory Platform

              Five Cloudflare sites:

              - rorygpk.online: Control center
              - show.rorygpk.online: Showcase
              - chat.rorygpk.online: Chat
              - complaint.rorygpk.online: Complaints
              - mail.rorygpk.online: Mail administration

              ## Phase 1

              This is a real foundation, not a fake finished system.

              Included:
              - Five hostname-aware site pages
              - D1 schema for accounts, roles, sessions, content, files, chat, complaints, mail aliases, automation, and audit logs
              - D1-backed maintenance mode
              - Bilingual visual shell
              - Fixed-background bicycle scroll scene
              - Magnetic stair-card scene
              - Private R2 and Mail Worker bindings
              - AI coding-agent safety rules

              Do not commit Cloudflare secrets, passwords, API tokens, verification codes, OAuth secrets, or owner credentials.
          """)

          put("database/0001_initial.sql", """
              PRAGMA foreign_keys = ON;

              CREATE TABLE IF NOT EXISTS roles (
                id TEXT PRIMARY KEY,
                label TEXT NOT NULL,
                is_admin INTEGER NOT NULL DEFAULT 0
              );

              INSERT OR IGNORE INTO roles (id, label, is_admin) VALUES
                ('user', 'User', 0),
                ('owner', 'Owner', 1),
                ('super_admin', 'Super Admin', 1),
                ('content_admin', 'Content Admin', 1),
                ('chat_admin', 'Chat Admin', 1),
                ('complaint_admin', 'Complaint Admin', 1),
                ('mail_admin', 'Mail Admin', 1),
                ('security_admin', 'Security Admin', 1),
                ('read_only_admin', 'Read Only Admin', 1);

              CREATE TABLE IF NOT EXISTS role_permissions (
                role_id TEXT NOT NULL,
                permission TEXT NOT NULL,
                PRIMARY KEY (role_id, permission)
              );

              CREATE TABLE IF NOT EXISTS users (
                id TEXT PRIMARY KEY,
                email TEXT NOT NULL,
                email_normalized TEXT NOT NULL UNIQUE,
                display_name TEXT NOT NULL,
                phone TEXT,
                phone_verified_at INTEGER,
                password_hash TEXT,
                language TEXT NOT NULL DEFAULT 'zh-CN',
                status TEXT NOT NULL DEFAULT 'pending',
                email_verified_at INTEGER,
                created_at INTEGER NOT NULL,
                updated_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS user_roles (
                user_id TEXT NOT NULL,
                role_id TEXT NOT NULL,
                PRIMARY KEY (user_id, role_id)
              );

              CREATE TABLE IF NOT EXISTS sessions (
                id TEXT PRIMARY KEY,
                user_id TEXT NOT NULL,
                token_hash TEXT NOT NULL UNIQUE,
                csrf_hash TEXT NOT NULL,
                expires_at INTEGER NOT NULL,
                revoked_at INTEGER,
                created_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS pending_signups (
                email_normalized TEXT PRIMARY KEY,
                email TEXT NOT NULL,
                display_name TEXT NOT NULL,
                phone TEXT,
                password_hash TEXT NOT NULL,
                language TEXT NOT NULL,
                code_hash TEXT NOT NULL,
                attempts INTEGER NOT NULL DEFAULT 0,
                expires_at INTEGER NOT NULL,
                created_at INTEGER NOT NULL,
                updated_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS oauth_states (
                state_hash TEXT PRIMARY KEY,
                nonce_hash TEXT NOT NULL,
                provider TEXT NOT NULL,
                return_host TEXT NOT NULL,
                expires_at INTEGER NOT NULL,
                created_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS showcase_items (
                id TEXT PRIMARY KEY,
                owner_id TEXT NOT NULL,
                title TEXT NOT NULL,
                description TEXT NOT NULL DEFAULT '',
                visibility TEXT NOT NULL DEFAULT 'members',
                scene_key TEXT NOT NULL DEFAULT 'bicycle-scroll',
                scene_config TEXT NOT NULL DEFAULT '{}',
                background_key TEXT NOT NULL DEFAULT 'coast',
                status TEXT NOT NULL DEFAULT 'published',
                created_at INTEGER NOT NULL,
                updated_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS files (
                id TEXT PRIMARY KEY,
                owner_id TEXT NOT NULL,
                item_id TEXT,
                object_key TEXT NOT NULL UNIQUE,
                filename TEXT NOT NULL,
                mime_type TEXT NOT NULL,
                size_bytes INTEGER NOT NULL,
                status TEXT NOT NULL DEFAULT 'ready',
                created_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS admin_applications (
                id TEXT PRIMARY KEY,
                user_id TEXT NOT NULL,
                requested_role TEXT NOT NULL,
                message TEXT NOT NULL DEFAULT '',
                status TEXT NOT NULL DEFAULT 'pending',
                reviewed_by TEXT,
                reviewed_at INTEGER,
                created_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS chat_rooms (
                id TEXT PRIMARY KEY,
                owner_id TEXT,
                name TEXT NOT NULL,
                is_public INTEGER NOT NULL DEFAULT 0,
                created_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS chat_members (
                room_id TEXT NOT NULL,
                user_id TEXT NOT NULL,
                role TEXT NOT NULL DEFAULT 'member',
                created_at INTEGER NOT NULL,
                PRIMARY KEY (room_id, user_id)
              );

              CREATE TABLE IF NOT EXISTS chat_messages (
                id TEXT PRIMARY KEY,
                room_id TEXT NOT NULL,
                sender_id TEXT NOT NULL,
                body TEXT NOT NULL,
                status TEXT NOT NULL DEFAULT 'visible',
                created_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS complaints (
                id TEXT PRIMARY KEY,
                ticket_no TEXT NOT NULL UNIQUE,
                user_id TEXT,
                email TEXT NOT NULL,
                title TEXT NOT NULL,
                content_ciphertext TEXT,
                content_iv TEXT,
                status TEXT NOT NULL DEFAULT 'pending',
                assigned_admin_id TEXT,
                created_at INTEGER NOT NULL,
                updated_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS email_aliases (
                id TEXT PRIMARY KEY,
                prefix TEXT NOT NULL UNIQUE,
                purpose TEXT NOT NULL DEFAULT 'custom',
                enabled INTEGER NOT NULL DEFAULT 1,
                created_by TEXT NOT NULL,
                created_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS email_alias_targets (
                alias_id TEXT NOT NULL,
                target_email TEXT NOT NULL,
                is_primary INTEGER NOT NULL DEFAULT 0,
                PRIMARY KEY (alias_id, target_email)
              );

              CREATE TABLE IF NOT EXISTS settings (
                key TEXT PRIMARY KEY,
                value TEXT NOT NULL,
                updated_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS automation_events (
                id TEXT PRIMARY KEY,
                event_key TEXT NOT NULL UNIQUE,
                severity TEXT NOT NULL,
                payload TEXT NOT NULL DEFAULT '{}',
                created_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS audit_logs (
                id TEXT PRIMARY KEY,
                actor_id TEXT,
                action TEXT NOT NULL,
                target_type TEXT,
                target_id TEXT,
                metadata TEXT NOT NULL DEFAULT '{}',
                created_at INTEGER NOT NULL
              );

              INSERT OR IGNORE INTO settings (key, value, updated_at) VALUES
                ('maintenance_mode', '0', 0),
                ('maintenance_message', '正在检修，稍后再来！', 0),
                ('uploads_restricted', '0', 0),
                ('global_storage_limit_bytes', '1073741824', 0);

              CREATE INDEX IF NOT EXISTS idx_sessions_hash ON sessions(token_hash);
              CREATE INDEX IF NOT EXISTS idx_showcase_owner ON showcase_items(owner_id);
              CREATE INDEX IF NOT EXISTS idx_files_owner ON files(owner_id);
              CREATE INDEX IF NOT EXISTS idx_complaints_status ON complaints(status);
              CREATE INDEX IF NOT EXISTS idx_audit_actor ON audit_logs(actor_id);
          """)

          put("workers/app/wrangler.toml", """
              name = "rory-platform-app"
              main = "src/index.js"
              compatibility_date = "2025-04-01"
              workers_dev = true

              [vars]
              ROOT_DOMAIN = "rorygpk.online"
              COOKIE_DOMAIN = ".rorygpk.online"
              TURNSTILE_SITE_KEY = ""
              MAX_UPLOAD_BYTES = "10485760"
              USER_STORAGE_LIMIT_BYTES = "104857600"
              GLOBAL_STORAGE_LIMIT_BYTES = "1073741824"

              [assets]
              directory = "./public"
              binding = "ASSETS"

              [[d1_databases]]
              binding = "DB"
              database_name = "rory-platform-db"
              database_id = "REPLACE_WITH_D1_DATABASE_ID"

              [[r2_buckets]]
              binding = "FILES"
              bucket_name = "rory-platform-files"
          """)

          put("workers/mail-router/wrangler.toml", """
              name = "rory-platform-mail-router"
              main = "src/index.js"
              compatibility_date = "2025-04-01"
              workers_dev = true

              [[d1_databases]]
              binding = "DB"
              database_name = "rory-platform-db"
              database_id = "REPLACE_WITH_D1_DATABASE_ID"
          """)

          put("workers/app/src/index.js", r'''
              const SITES = new Set(["control", "show", "chat", "complaint", "mail"]);

              function json(data, status = 200) {
                return new Response(JSON.stringify(data), {
                  status,
                  headers: {
                    "Content-Type": "application/json; charset=utf-8",
                    "Cache-Control": "no-store"
                  }
                });
              }

              function secure(response) {
                const headers = new Headers(response.headers);

                headers.set(
                  "Content-Security-Policy",
                  "default-src 'self'; img-src 'self' https://images.unsplash.com data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'"
                );
                headers.set("X-Content-Type-Options", "nosniff");
                headers.set("X-Frame-Options", "DENY");
                headers.set("Referrer-Policy", "no-referrer");
                headers.set("Cross-Origin-Opener-Policy", "same-origin");
                headers.set("Cross-Origin-Resource-Policy", "same-site");
                headers.set("Permissions-Policy", "camera=(), microphone=(), geolocation=()");
                headers.set("Strict-Transport-Security", "max-age=31536000; includeSubDomains");

                return new Response(response.body, {
                  status: response.status,
                  statusText: response.statusText,
                  headers
                });
              }

              function escapeHtml(value) {
                return String(value || "").replace(/[&<>"']/g, (character) => ({
                  "&": "&amp;",
                  "<": "&lt;",
                  ">": "&gt;",
                  '"': "&quot;",
                  "'": "&#39;"
                }[character]));
              }

              function siteFromHost(hostname, rootDomain) {
                const host = hostname.toLowerCase();

                if (host === rootDomain) return "control";

                const prefix = host.replace(`.${rootDomain}`, "");
                return SITES.has(prefix) ? prefix : "control";
              }

              async function maintenanceState(env) {
                try {
                  const result = await env.DB.prepare(
                    "SELECT key, value FROM settings WHERE key IN ('maintenance_mode', 'maintenance_message')"
                  ).all();

                  const values = Object.fromEntries(
                    result.results.map((item) => [item.key, item.value])
                  );

                  return {
                    enabled: values.maintenance_mode === "1",
                    message: values.maintenance_message || "正在检修，稍后再来！"
                  };
                } catch {
                  return {
                    enabled: true,
                    message: "正在检修，稍后再来！"
                  };
                }
              }

              function maintenancePage(message) {
                return new Response(
                  `<!doctype html>
                  <html lang="zh-CN">
                  <head>
                    <meta charset="utf-8">
                    <meta name="viewport" content="width=device-width,initial-scale=1">
                    <title>Maintenance</title>
                    <style>
                      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17202a;color:#f4f1eb;font-family:Arial,sans-serif}
                      main{width:min(620px,88vw);padding:42px;background:#25313b;border-top:7px solid #0f766e}
                      h1{margin:0 0 16px;font-size:32px}
                      p{line-height:1.75;color:#dfdbd1}
                    </style>
                  </head>
                  <body>
                    <main>
                      <h1>正在检修，稍后再来！</h1>
                      <p>${escapeHtml(message)}</p>
                      <p>Maintenance is in progress. Please return shortly.</p>
                    </main>
                  </body>
                  </html>`,
                  {
                    status: 503,
                    headers: {
                      "Content-Type": "text/html; charset=utf-8",
                      "Cache-Control": "no-store",
                      "Retry-After": "300"
                    }
                  }
                );
              }

              async function api(request, env) {
                const url = new URL(request.url);

                if (url.pathname === "/api/health") {
                  return json({ ok: true, service: "rory-platform-app", time: Date.now() });
                }

                if (url.pathname === "/api/config") {
                  return json({
                    turnstileSiteKey: env.TURNSTILE_SITE_KEY || "",
                    githubOAuthConfigured: Boolean(
                      env.GITHUB_CLIENT_ID && env.GITHUB_CLIENT_SECRET
                    ),
                    googleOAuthConfigured: Boolean(
                      env.GOOGLE_CLIENT_ID && env.GOOGLE_CLIENT_SECRET
                    )
                  });
                }

                return json({ error: "NOT_FOUND" }, 404);
              }

              async function serveStatic(request, env) {
                const url = new URL(request.url);
                const assetUrl = new URL(request.url);
                const site = siteFromHost(url.hostname, env.ROOT_DOMAIN);

                if (assetUrl.pathname === "/" || assetUrl.pathname === "/index.html") {
                  assetUrl.pathname = `/${site}/index.html`;
                }

                return env.ASSETS.fetch(new Request(assetUrl.toString(), request));
              }

              export default {
                async fetch(request, env) {
                  try {
                    const url = new URL(request.url);

                    if (url.pathname === "/api/health") {
                      return secure(await api(request, env));
                    }

                    const maintenance = await maintenanceState(env);

                    if (maintenance.enabled) {
                      return secure(
                        url.pathname.startsWith("/api/")
                          ? json({ error: "MAINTENANCE_MODE" }, 503)
                          : maintenancePage(maintenance.message)
                      );
                    }

                    if (url.pathname.startsWith("/api/")) {
                      return secure(await api(request, env));
                    }

                    return secure(await serveStatic(request, env));
                  } catch (error) {
                    console.error("Rory Platform worker error", error);
                    return secure(json({ error: "INTERNAL_ERROR" }, 500));
                  }
                }
              };
          ''')

          put("workers/mail-router/src/index.js", r'''
              export default {
                async email(message, env) {
                  const recipient = String(message.to || "").toLowerCase();
                  const prefix = recipient.split("@")[0];

                  const alias = await env.DB.prepare(
                    "SELECT id FROM email_aliases WHERE prefix = ? AND enabled = 1 LIMIT 1"
                  ).bind(prefix).first();

                  if (!alias) {
                    message.setReject("Unknown recipient.");
                    return;
                  }

                  const target = await env.DB.prepare(
                    `SELECT target_email
                     FROM email_alias_targets
                     WHERE alias_id = ?
                     ORDER BY is_primary DESC, target_email ASC
                     LIMIT 1`
                  ).bind(alias.id).first();

                  if (!target) {
                    message.setReject("Recipient temporarily unavailable.");
                    return;
                  }

                  await message.forward(target.target_email);
                }
              };
          ''')

          put("workers/app/public/site.css", r'''
              :root{
                --ink:#17202a;
                --paper:#f4f1eb;
                --panel:#fffdf8;
                --line:#cbc3b4;
                --muted:#686760;
                --teal:#0f766e;
                --coral:#c94f38;
                --gold:#b88918;
              }

              *{box-sizing:border-box}
              html{scroll-behavior:smooth}
              body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
              button,select{font:inherit}
              button{cursor:pointer}
              .nav{
                position:sticky;top:0;z-index:20;min-height:62px;
                display:flex;align-items:center;justify-content:space-between;gap:18px;
                padding:10px clamp(16px,4vw,64px);background:rgba(244,241,235,.96);
                border-bottom:1px solid var(--line)
              }
              .brand{font-weight:800;letter-spacing:.05em;text-decoration:none}
              .nav-actions{display:flex;gap:8px;align-items:center}
              .button{
                min-height:38px;padding:8px 12px;border:1px solid var(--ink);
                border-radius:5px;background:transparent;color:var(--ink)
              }
              .button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
              .shell{width:min(1180px,92vw);margin:auto;padding:42px 0 80px}
              .eyebrow{margin:0 0 8px;color:var(--teal);font-size:13px;font-weight:800;text-transform:uppercase}
              h1{font-size:clamp(36px,5vw,68px);line-height:1.04;margin:0 0 18px}
              h2{font-size:28px;margin:0 0 12px}
              p{line-height:1.65}
              .muted{color:var(--muted)}
              .grid{display:grid;gap:18px}
              .three{grid-template-columns:repeat(3,minmax(0,1fr))}
              .panel{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:7px}
              .metric{font-size:34px;font-weight:800}
              .hero{
                position:relative;min-height:720px;overflow:hidden;color:#fff;
                background-image:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2200&q=85");
                background-size:cover;background-position:center;background-attachment:fixed
              }
              .hero:before{content:"";position:absolute;inset:0;background:rgba(16,42,49,.49)}
              .hero-copy{
                position:relative;z-index:2;width:min(820px,90vw);margin:auto;
                padding:118px 0 260px;text-shadow:0 2px 14px rgba(0,0,0,.4)
              }
              .hero-copy p{max-width:680px;font-size:clamp(18px,2.3vw,26px)}
              .road{
                position:absolute;z-index:2;left:0;right:0;bottom:0;height:188px;
                background:#292d30;border-top:8px solid #ded6c7
              }
              .road:after{
                content:"";position:absolute;left:0;right:0;top:51%;height:8px;
                background:repeating-linear-gradient(90deg,#fff 0 54px,transparent 54px 96px)
              }
              .cyclist{position:absolute;z-index:4;bottom:55px;left:-170px;width:150px;height:110px;will-change:transform}
              .wheel{position:absolute;bottom:0;width:43px;height:43px;border:6px solid #f4f1eb;border-radius:50%}
              .wheel.one{left:10px}.wheel.two{right:10px}
              .frame{position:absolute;left:48px;bottom:30px;width:56px;height:35px;border-left:6px solid #f0bc3c;border-bottom:6px solid #f0bc3c;transform:skew(-24deg)}
              .rider-head{position:absolute;left:73px;top:6px;width:20px;height:20px;border-radius:50%;background:#f0bc3c}
              .rider-body{position:absolute;left:69px;top:26px;width:31px;height:45px;border-left:8px solid #f0bc3c;border-bottom:8px solid #f0bc3c;transform:skew(-18deg)}
              .scene-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px;text-shadow:none}
              .scene-controls label{display:grid;gap:5px;padding:8px;background:rgba(23,32,42,.72);border:1px solid rgba(255,255,255,.45)}
              .magnet-area{padding:82px 0;background:#ded8cd}
              .magnet-list{display:grid;gap:20px}
              .magnet-card{
                width:min(720px,90%);padding:26px;background:var(--panel);
                border:1px solid var(--ink);box-shadow:8px 8px 0 rgba(23,32,42,.14);
                will-change:transform
              }
              .magnet-card:nth-child(odd){justify-self:start}
              .magnet-card:nth-child(even){justify-self:end}
              .site-badge{display:inline-block;padding:5px 8px;border-radius:3px;background:#d7ece8;color:#075e57;font-size:12px;font-weight:700}
              @media(max-width:760px){
                .three{grid-template-columns:1fr}
                .hero{min-height:620px;background-attachment:scroll}
                .hero-copy{padding-top:86px}
                .magnet-card{width:100%;justify-self:stretch}
              }
              @media(prefers-reduced-motion:reduce){
                html{scroll-behavior:auto}
                .hero{background-attachment:scroll}
                .cyclist,.magnet-card{transform:none!important}
              }
          ''')

          put("workers/app/public/site.js", r'''
              const app = document.querySelector("#app");
              const site = document.body.dataset.site || "control";
              const languageButton = document.querySelector("#language");

              const words = {
                zh: {
                  control: ["总管中心", "统一管理五个独立站点、权限、自动化与检修状态。"],
                  show: ["展示中心", "让用户发布自己的内容，并通过受控视觉场景展示作品。"],
                  chat: ["聊天中心", "独立聊天站点，后续接入实时消息与审核机制。"],
                  complaint: ["投诉中心", "投诉编号、分配、升级、审计与安全附件流程。"],
                  mail: ["Mail 管理", "管理员自定义邮箱前缀、路由、通知与邮件审计。"],
                  visual: "视觉预览",
                  next: "安全注册、GitHub OAuth、Turnstile 和所有权 API 将在下一阶段接入。"
                },
                en: {
                  control: ["Control Center", "Manage five independent sites, permissions, automation, and maintenance."],
                  show: ["Showcase", "Users publish their own content through controlled visual scenes."],
                  chat: ["Chat", "A separate chat site with real-time messaging and moderation in the next phase."],
                  complaint: ["Complaints", "Ticketing, assignment, escalation, audit, and protected evidence."],
                  mail: ["Mail Admin", "Administrator-controlled custom aliases, routing, notifications, and audit."],
                  visual: "Visual preview",
                  next: "Secure registration, GitHub OAuth, Turnstile, and ownership APIs arrive in the next phase."
                }
              };

              let language = localStorage.getItem("rory-language") === "en" ? "en" : "zh";

              function render() {
                const copy = words[language];
                const [title, description] = copy[site] || copy.control;

                app.innerHTML = `
                  <section class="hero">
                    <div class="hero-copy">
                      <p class="eyebrow">${copy.visual}</p>
                      <h1>${title}</h1>
                      <p>${description}</p>
                      <div class="scene-controls">
                        <label>Accent
                          <select id="accent">
                            <option value="#0f766e">Teal</option>
                            <option value="#c94f38">Coral</option>
                            <option value="#b88918">Gold</option>
                          </select>
                        </label>
                        <label>Motion
                          <select id="motion">
                            <option value="1">Normal</option>
                            <option value=".55">Slow</option>
                            <option value="1.7">Fast</option>
                          </select>
                        </label>
                      </div>
                    </div>
                    <div class="road"></div>
                    <div class="cyclist" id="cyclist" aria-hidden="true">
                      <i class="wheel one"></i><i class="wheel two"></i>
                      <i class="frame"></i><i class="rider-head"></i><i class="rider-body"></i>
                    </div>
                  </section>
                  <section class="shell">
                    <p class="eyebrow">Rory Platform</p>
                    <div class="grid three">
                      <article class="panel">
                        <span class="site-badge">${site}</span>
                        <h2>Foundation</h2>
                        <p class="muted">${copy.next}</p>
                      </article>
                      <article class="panel">
                        <p class="metric">5</p>
                        <h2>Sites</h2>
                        <p class="muted">Control, Show, Chat, Complaint, Mail</p>
                      </article>
                      <article class="panel">
                        <p class="metric">D1 + R2</p>
                        <h2>Cloudflare</h2>
                        <p class="muted">Private storage and audited data structures are prepared.</p>
                      </article>
                    </div>
                  </section>
                  <section class="magnet-area">
                    <div class="shell">
                      <p class="eyebrow">Magnet stairs</p>
                      <div class="magnet-list">
                        <article class="magnet-card"><h2>01. Publish</h2><p>Each user will own their content through server-side ownership checks.</p></article>
                        <article class="magnet-card"><h2>02. Moderate</h2><p>Roles, audit logs, automation events, and maintenance controls belong in D1.</p></article>
                        <article class="magnet-card"><h2>03. Evolve</h2><p>Future changes use Git branches, preview deployments, checks, review, and release.</p></article>
                      </div>
                    </div>
                  </section>
                `;

                document.querySelector("#accent").addEventListener("change", (event) => {
                  document.documentElement.style.setProperty("--teal", event.target.value);
                });

                document.querySelector("#motion").addEventListener("change", (event) => {
                  document.documentElement.dataset.motion = event.target.value;
                });

                bindMotion();
              }

              function bindMotion() {
                if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

                const cyclist = document.querySelector("#cyclist");
                const cards = [...document.querySelectorAll(".magnet-card")];
                let scheduled = false;

                function update() {
                  const hero = document.querySelector(".hero");
                  const ratio = Math.max(0, Math.min(1, (window.scrollY + innerHeight * .2) / hero.offsetHeight));
                  const speed = Number(document.documentElement.dataset.motion || 1);

                  cyclist.style.transform = `translateX(${ratio * (innerWidth + 190) * speed}px)`;

                  cards.forEach((card, index) => {
                    const rect = card.getBoundingClientRect();
                    const distance = Math.min(1, Math.abs(rect.top + rect.height / 2 - innerHeight / 2) / innerHeight);
                    const shift = (1 - distance) * 16 * (index % 2 ? -1 : 1);
                    card.style.transform = `translateX(${shift}px) scale(${1 + (1 - distance) * .05})`;
                  });

                  scheduled = false;
                }

                addEventListener("scroll", () => {
                  if (!scheduled) {
                    scheduled = true;
                    requestAnimationFrame(update);
                  }
                }, { passive: true });

                addEventListener("resize", update);
                update();
              }

              languageButton.addEventListener("click", () => {
                language = language === "zh" ? "en" : "zh";
                localStorage.setItem("rory-language", language);
                languageButton.textContent = language === "zh" ? "EN" : "中文";
                document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
                render();
              });

              languageButton.textContent = language === "zh" ? "EN" : "中文";
              render();
          ''')

