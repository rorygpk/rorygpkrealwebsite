          put("AGENTS.md", """
              # AI Coding Agent Rules

              An AI coding agent may work only through a Git branch and Pull Request.

              - Read existing code before editing.
              - Never read, print, commit, rotate, or modify secrets.
              - Never force-push or directly edit production.
              - Never delete D1 data, R2 objects, users, or administrators.
              - Never change authentication, OAuth, permissions, encryption, mail routing, or migrations without Owner review.
              - Run tests and checks before opening a Pull Request.
              - High-risk automation may mark, rate-limit, notify, or escalate. It may not permanently ban or delete without human approval.
              - Deploy through preview first, then approved merge.
          """)

          put("docs/CLOUDFLARE_SETUP.md", """
              # Manual Cloudflare Setup

              No Cloudflare API Token is required for this repository generation.

              Create manually in Cloudflare Dashboard:
              1. D1 database: rory-platform-db
              2. Private R2 bucket: rory-platform-files
              3. Worker: rory-platform-app
              4. Email Worker: rory-platform-mail-router
              5. Turnstile widget
              6. Email Routing catch-all rule, later

              Run database/0001_initial.sql in the D1 Console.
              Then place the D1 ID in both wrangler.toml files.

              Bind the application Worker to:
              - rorygpk.online
              - show.rorygpk.online
              - chat.rorygpk.online
              - complaint.rorygpk.online
              - mail.rorygpk.online

              Never commit secrets. Configure them in Cloudflare only:
              SESSION_PEPPER
              PASSWORD_PEPPER
              CODE_PEPPER
              TURNSTILE_SECRET
              RESEND_API_KEY
              MAIL_FROM
              OWNER_EMAIL
              OWNER_BOOTSTRAP_CODE
              GITHUB_CLIENT_ID
              GITHUB_CLIENT_SECRET
          """)

          required = [
              "README.md",
              "package.json",
              "database/0001_initial.sql",
              "workers/app/wrangler.toml",
              "workers/app/src/index.js",
              "workers/app/public/site.css",
              "workers/app/public/site.js",
              "workers/app/public/control/index.html",
              "workers/app/public/show/index.html",
              "workers/app/public/chat/index.html",
              "workers/app/public/complaint/index.html",
              "workers/app/public/mail/index.html",
              "workers/mail-router/wrangler.toml",
              "workers/mail-router/src/index.js",
              "AGENTS.md",
              "docs/CLOUDFLARE_SETUP.md"
          ]

          for item in required:
              target = root / item
              if not target.exists() or target.stat().st_size < 40:
                  raise SystemExit(f"Invalid generated file: {target}")

          print(f"Generated and validated {len(required)} non-empty files.")
